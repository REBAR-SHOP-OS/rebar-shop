name: Lint Odoo Modules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 pylint-odoo

      - name: Discover Odoo addon directories
        id: addons
        run: |
          dirs=$(find . -maxdepth 2 -name "__manifest__.py" -printf '%h\n' | sed 's|^\./||' | sort)
          echo "Found addons:"
          echo "$dirs"
          {
            echo "dirs<<EOF"
            echo "$dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: flake8 (fatal errors only - syntax errors, undefined names)
        env:
          ADDON_DIRS: ${{ steps.addons.outputs.dirs }}
        run: |
          # These checks catch code that would fail to even import in Odoo.
          # Style/complexity issues are tracked separately (see issue #44/#49)
          # and are not yet blocking to avoid failing on pre-existing debt.
          flake8 --select=E9,F63,F7,F82 $ADDON_DIRS

      - name: flake8 (full report, non-blocking)
        env:
          ADDON_DIRS: ${{ steps.addons.outputs.dirs }}
        run: |
          flake8 --max-line-length=160 $ADDON_DIRS || true

      - name: pylint-odoo (non-blocking)
        env:
          ADDON_DIRS: ${{ steps.addons.outputs.dirs }}
        run: |
          pylint --load-plugins=pylint_odoo -d all -e odoolint $ADDON_DIRS || true

      - name: Validate __manifest__.py files
        run: python .github/scripts/validate_manifests.py

      - name: Reject committed build artifacts
        run: |
          set -e
          matches=$(git ls-files | grep -E '(^|/)node_modules/|(^|/)dist/|\.pyc$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Build artifacts must not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "No committed node_modules/dist/*.pyc found."
